[package]
name = "rdock"
version = "0.1.0"
edition = "2021"
description = "A macOS-style dock for X11 Linux desktops, written in pure Rust"
rust-version = "1.82"
license = "MIT"

[dependencies]
x11rb = { version = "0.13", features = ["randr", "shape"] }
tiny-skia = "0.11"
resvg = "0.45"
ab_glyph = "0.2"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
